<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Shazam Mini</title>
    <style>html,body{background:#06080f!important;margin:0}</style>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex-col min-h-screen relative">

    <div id="flash-guard" style="position:fixed;inset:0;z-index:9999;background:#06080f;pointer-events:none;"></div>

    <canvas id="galaxy-canvas"></canvas>

    <div class="bg-ambiance">
        <div class="bg-grain"></div>
        <div class="bg-glow-top"></div>
        <div class="bg-glow-bottom"></div>
    </div>

    <header class="app-header">
        <h1 class="app-header-title title-gradient">ESTADÍSTICAS</h1>
        <div class="header-actions">
            <div id="connection-dot" class="connection-dot connection-dot-loading" title="Verificando conexión..."></div>
            <button id="settings-button" class="btn-icon" title="Configuración">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:20px;height:20px">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.991a6.936 6.936 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </button>
        </div>
    </header>

    <main class="page-container">
        <h2 class="page-title">Estadísticas</h2>

        <div id="loading-text" class="loading-state">
            Cargando
            <span class="loading-dots">
                <span></span><span></span><span></span>
            </span>
        </div>

        <div id="stats-grid" class="stats-grid hidden"></div>

        <div id="stats-sections" class="hidden">
            <section class="stats-section">
                <h3 class="stats-section-title">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:18px;height:18px"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h1.5c.621 0 1.125.504 1.125 1.125v6.75C6.75 20.496 6.246 21 5.625 21h-1.5A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h1.5c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-1.5a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h1.5c.621 0 1.125.504 1.125 1.125v15.75c0 .621-.504 1.125-1.125 1.125h-1.5a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>
                    Canciones más identificadas
                </h3>
                <div id="top-songs-list" class="stats-rank-list"></div>
            </section>

            <section class="stats-section">
                <h3 class="stats-section-title">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:18px;height:18px"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0" /></svg>
                    Artistas más identificados
                </h3>
                <div id="top-artists-list" class="stats-rank-list"></div>
            </section>
        </div>
    </main>

    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-panel">
            <h3 class="modal-title">Configuración</h3>
            <p class="modal-desc">Dirección IP de tu servidor para conectarte en red local.</p>
            <label class="modal-label">Servidor</label>
            <input type="text" id="backend-url-input" class="input-field" placeholder="http://192.168.1.15:5000">
            <div class="modal-actions">
                <button id="save-settings-btn" class="btn btn-primary">Guardar</button>
                <button id="close-settings-btn" class="btn btn-ghost">Cancelar</button>
            </div>
        </div>
    </div>

    <nav class="tab-bar">
        <a href="index.html" class="tab-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3Z" />
            </svg>
            <span class="tab-label">Escanear</span>
        </a>
        <a href="history.html" class="tab-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="tab-label">Historial</span>
        </a>
        <a href="playlist.html" class="tab-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 0v5.25m0-5.25v12.75a3 3 0 01-3 3h-3a3 3 0 01-3-3V9H9.75M9 9V4.5a3 3 0 00-3-3H3a3 3 0 00-3 3V15a3 3 0 003 3h3a3 3 0 003-3V9h.75" />
            </svg>
            <span class="tab-label">Playlist</span>
        </a>
        <a href="stats.html" class="tab-item active">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h1.5c.621 0 1.125.504 1.125 1.125v6.75C6.75 20.496 6.246 21 5.625 21h-1.5A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h1.5c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-1.5a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h1.5c.621 0 1.125.504 1.125 1.125v15.75c0 .621-.504 1.125-1.125 1.125h-1.5a1.125 1.125 0 01-1.125-1.125V4.125z" />
            </svg>
            <span class="tab-label">Stats</span>
        </a>
    </nav>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/connection.js"></script>
    <script src="js/galaxy.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/page-transition.js"></script>
</body>
</html>
